[project]
name = "insurance-email-ambient-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.2.28",
    "langchain-openai>=1.1.14",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.7",
    "langsmith>=0.7.31",
    "markitdown[all]==0.1.5",
    "pydantic>=2.13.4",
    "torch>=2.12.1",
    "transformers>=5.13.0",
    "trustcall>=0.0.39",
]


[tool.pyright]
venvPath = "."
venv = ".venv"
# src-layout: let pyright resolve first-party imports
extraPaths = ["src"]
