[project]
name = "insurance-email-ambient-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.4",
    "imap-tools>=1.13.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.2.28",
    "langchain-openai>=1.1.14",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.7",
    "langgraph-sdk>=0.4.2",
    "langsmith>=0.7.31",
    "markitdown[all]==0.1.5",
    "pydantic>=2.13.4",
    "reportlab>=5.0.0",
    "tiktoken>=0.13.0",
    "torch>=2.12.1",
    "transformers>=5.13.0",
    "trustcall>=0.0.39",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `import tests.golden` and `import scripts...` resolve
# (src-layout keeps first-party `insurance_email_agent` importable from the installed pkg).
pythonpath = ["."]
addopts = "-q"


[tool.pyright]
venvPath = "."
venv = ".venv"
# src-layout: let pyright resolve first-party imports
extraPaths = ["src"]
